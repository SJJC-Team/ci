name: Run pure unit tests
on:
  workflow_call:
    inputs:
      work_dir:
        type: string
        required: false
        default: '.'
        description: "Your main work directory."
      with_pg_version:
        type: number
        required: false
        default: 17
        description: "PostgreSQL Version"
      with_pg_configs:
        type: string
        required: false
        default: ''
        description: "Testing postgres configurations, parameters should be: \"user1 db1 pass1 6001 db2 db3 db4\" \"user2 db2 pass2 6002\" ..."
      only_build:
        type: boolean
        required: false
        default: false
        description: "True means only build, false means run test then."
      test_filter:
        type: string
        required: false
        default: ''
        description: "Apply a --filter to the tests that will be run."
      with_testing:
        type: boolean
        required: false
        default: true
        description: "Set to 'true' to enable compilation for testing and @testable imports. Defaults to 'true'."
      with_release_mode_testing:
        type: boolean
        required: false
        default: false
        description: "Set to 'true' to enable testing in release mode as well. Defaults to 'false'."
      with_tsan:
        type: boolean
        required: false
        default: true
        description: "Set to 'true' to run tests with Thread Sanitizer. Defaults to 'true'."
      warnings_as_errors:
        type: boolean
        required: false
        default: false
        description: "Set to 'true' to treat warnings as errors. Defaults to 'false'."
      with_api_check:
        type: boolean
        required: false
        default: true
        description: "Set to 'true' to run the SwiftPM public API breakage check. Defaults to 'true'."
      with_linting:
        type: boolean
        required: false
        default: false
        description: "Set to 'true' to run swift-format's lint process. Defaults to 'false'."
      with_musl:
        type: boolean
        required: false
        default: false
        description: "Set to 'true' to build with the Static Linux SDK to test MUSL compatibility. Defaults to 'false'."
      ios_scheme_name:
        type: string
        required: false
        default: ''
        description: "Set to the scheme name in Xcode to run tests on iOS. Defaults to '' which won't run any tests."
      extra_flags:
        type: string
        required: false
        default: ''
        description: "Additional 'swift test' flags to be applied on when testing on all platforms."
      extra_musl_flags:
        type: string
        required: false
        default: ''
        description: "Additional 'swift build' flags to be applied on when compiling with MUSL."
      ios_xcodebuild_action:
        type: string
        required: false
        default: 'test'
        description: "Action to pass to xcodebuild when running iOS tests. Defaults to 'test'. Set to '' to just compile and not run tests."
      with_eopa_host:
        type: string
        required: false
        default: ''
        description: "EOPA host"
      with_eopa_port:
        type: string
        required: false
        default: ''
        description: "EOPA port"
      with_eopa_version:
        type: string
        required: false
        default: ''
        description: "EOPA version"
      enable_all_traits:
        type: boolean
        required: false
        default: false
        description: "Set to 'false' to enable only default traits when running tests. Defaults to 'false'. Doesn't have any effect on the disabled-traits-unit job."
    secrets:
      CODECOV_TOKEN:
        required: false
env:
  WITH_TESTING: ${{ inputs.with_testing && '-Xswiftc -enable-testing' || '' }}
  EXTRA_FLAGS:  ${{ inputs.extra_flags || '--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable' }}
  EXTRA_MUSL_FLAGS: ${{ inputs.extra_musl_flags }}
  WITH_TSAN: ${{ inputs.with_tsan && '--sanitize=thread' || '' }}
  WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors && '-Xswiftc -warnings-as-errors' || '' }}
  TEST_FILTER:  ${{ inputs.test_filter != '' && format('--filter={0}', inputs.test_filter) || '' }}
  IOS_SCHEME_NAME: ${{ inputs.ios_scheme_name }}
  IOS_XCODEBUILD_ACTION: ${{ inputs.ios_xcodebuild_action }}
  ENABLE_ALL_TRAITS: ${{ inputs.enable_all_traits && '--enable-all-traits' || '' }}

jobs:
  api-breakage:
    if: ${{ inputs.with_api_check && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container: swift:noble
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with: { 'fetch-depth': 0 }
      - name: Run API breakage check
        working-directory: ${{ inputs.work_dir }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          swift package . diagnose-api-breaking-changes origin/develop ${EXTRA_FLAGS}

  determine-linux-matrix:
    if: ${{ !(github.event.pull_request.draft || false) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: check-swift-minus-2
        uses: whooshing-workshop/ci/.github/actions/check-compatible-swift@develop
        with: { package_root: "${{ inputs.work_dir }}", assume_installed_version: "6.1.3" }
      - id: check-swift-minus-1
        uses: whooshing-workshop/ci/.github/actions/check-compatible-swift@develop
        with: { package_root: "${{ inputs.work_dir }}", assume_installed_version: "6.2.4" }
      - id: check-swift-current
        uses: whooshing-workshop/ci/.github/actions/check-compatible-swift@develop
        with: { package_root: "${{ inputs.work_dir }}", assume_installed_version: "6.3.0" }
      - id: gen-matrix
        shell: bash
        env:
          RELTST: ${{ inputs.with_release_mode_testing && '1' || '0' }}
          SMIN2: ${{ steps.check-swift-minus-2.outputs.swift-compatible == 'true' && 1 || 0 }}
          SMIN1: ${{ steps.check-swift-minus-1.outputs.swift-compatible == 'true' && 1 || 0 }}
          SCURR: ${{ steps.check-swift-current.outputs.swift-compatible == 'true' && 1 || 0 }}
        run: |
          set -e
          echo "matrix=$(jq -nc \
            --arg rltst "${RELTST}" --arg sm2 "${SMIN2}" --arg sm1 "${SMIN1}" --arg scr "${SCURR}" \
            '{"swift-config": (
              (if $sm2 == "1" then                   [{ image: "swift:6.1-noble", "build-mode": "debug" }] else [] end) +
              (if $sm1 == "1" then                   [{ image: "swift:6.2-noble", "build-mode": "debug" }] else [] end) +
              (if $scr == "1" then                   [{ image: "swift:6.3-noble", "build-mode": "debug" }] else [] end) +
              (if $scr == "1" and $rltst == "1" then [{ image: "swift:6.3-noble", "build-mode": "release" }] else [] end)
                                                  #+ [{ image: "swiftlang/swift:nightly-main-noble", "build-mode": "debug" }]
            )}')" >> "${GITHUB_OUTPUT}"

  linux-unit:
    if: ${{ !(github.event.pull_request.draft || false) }}
    needs: determine-linux-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-linux-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    container: ${{ matrix.swift-config.image }}
    timeout-minutes: 60
    
    steps:
      - name: Install curl and zstd
        run: apt-get update -yq && apt-get install -y curl zstd
      - name: Check out code
        uses: actions/checkout@v6
      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: "${{ inputs.work_dir || '.' }}/.build"
          key: "${{ matrix.swift-config.image }}-${{ matrix.swift-config.build-mode }}-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "${{ matrix.swift-config.image }}-${{ matrix.swift-config.build-mode }}-build-${{ runner.os }}-"

      - name: Download shared CI script
        uses: actions/checkout@v4
        if: ${{ inputs.with_pg_configs != '' || (inputs.with_eopa_host != '' && inputs.with_eopa_port != '') }}
        with:
          repository: whooshing-workshop/ci
          path: ${{ inputs.work_dir }}/.ci
      
      - name: Init System
        working-directory: ${{ inputs.work_dir }}
        if: ${{ inputs.with_pg_configs != '' || (inputs.with_eopa_host != '' && inputs.with_eopa_port != '') }}
        shell: bash
        run: |
            cp .ci/.github/workflows/ubuntu/init.sh ./init.sh
            chmod +x ./init.sh
            ./init.sh
        
      - name: Prepare PostgreSQL
        working-directory: ${{ inputs.work_dir }}
        if: ${{ inputs.with_pg_configs != '' }}
        shell: bash
        run: |
            cp .ci/.github/workflows/ubuntu/postgres.sh ./postgres.sh
            chmod +x ./postgres.sh
            
            pgconfigs=()
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              pgconfigs+=("$line")
            done <<< "${{ inputs.with_pg_configs }}"

            args=()
            for cfg in "${pgconfigs[@]}"; do
              args+=("$cfg")
            done
            
            ./postgres.sh ${{ inputs.with_pg_version }} "${args[@]}"
      - name: Prepare EOPA
        working-directory: ${{ inputs.work_dir }}
        if: ${{ inputs.with_eopa_host != '' && inputs.with_eopa_port != '' }}
        shell: bash
        run: |
            cp .ci/.github/workflows/ubuntu/eopa.sh ./eopa.sh
            chmod +x ./eopa.sh

            ./eopa.sh ${{ inputs.with_eopa_host }}:${{ inputs.with_eopa_port }} ${{ inputs.with_eopa_version }}

            until curl -s http://${{ inputs.with_eopa_host }}:${{ inputs.with_eopa_port }}/health > /dev/null; do
              echo "Waiting for EOPA..."
              sleep 1
            done
      - name: Build
        working-directory: ${{ inputs.work_dir }}
        run: |
          swift build \
            -c ${{ matrix.swift-config.build-mode }}
      - name: Run unit tests
        if: ${{ (!inputs.only_build) && (matrix.swift-config.build-mode == 'debug' || inputs.with_release_mode_testing) }}
        working-directory: ${{ inputs.work_dir }}
        run: |
          GITHUB_EOPA_TESTING_HOST=${{ inputs.with_eopa_host }} \
          GITHUB_EOPA_TESTING_PORT=${{ inputs.with_eopa_port }} \
          SWIFT_DETERMINISTIC_HASHING=1 \
          swift test \
            -c ${{ matrix.swift-config.build-mode }} \
            ${WITH_TESTING} \
            ${WITH_TSAN} \
            ${WARNINGS_AS_ERRORS} \
            ${WITH_COVERAGE} \
            ${TEST_FILTER} \
            ${ENABLE_ALL_TRAITS} \
            ${EXTRA_FLAGS}
      - name: Print EOPA logs on failure
        if: ${{ failure() && inputs.with_eopa_host != '' && inputs.with_eopa_port != '' }}
        working-directory: ${{ inputs.work_dir }}
        run: cat eopa.log

  macos-unit:
    if: ${{ !(github.event.pull_request.draft || false) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos-version: macos-15
            xcode-version: latest-stable
          - macos-version: macos-26
            xcode-version: latest-stable
    runs-on: ${{ matrix.macos-version }}
    timeout-minutes: 60
    steps:
      - name: Select appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode-version }}
      - name: Check out code
        uses: actions/checkout@v6
      - name: Check Swift compatibility
        id: swift-check
        uses: whooshing-workshop/ci/.github/actions/check-compatible-swift@develop
        with: { package_root: "${{ inputs.work_dir }}" }
      - name: Cache .build
        if: steps.swift-check.outputs.swift-compatible == 'true'
        uses: actions/cache@v5
        with:
          path: "${{ inputs.work_dir || '.' }}/.build"
          key: "${{ matrix.xcode-version }}-${{ matrix.macos-version }}-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "${{ matrix.xcode-version }}-${{ matrix.macos-version }}-build-${{ runner.os }}-"
      - name: Download shared CI script
        uses: actions/checkout@v4
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' && ( inputs.with_pg_configs != '' || (inputs.with_eopa_host != '' && inputs.with_eopa_port != '') ) }}
        with:
          repository: whooshing-workshop/ci
          path: ${{ inputs.work_dir }}/.ci
      - name: Init System
        working-directory: ${{ inputs.work_dir }}
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' && ( inputs.with_pg_configs != '' || (inputs.with_eopa_host != '' && inputs.with_eopa_port != '') ) }}
        shell: bash
        run: |
            cp .ci/.github/workflows/macos/init.sh ./init.sh
            chmod +x ./init.sh
            ./init.sh
      - name: Prepare PostgreSQL
        working-directory: ${{ inputs.work_dir }}
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' && inputs.with_pg_configs != '' }}
        shell: bash
        run: |
            cp .ci/.github/workflows/macos/postgres.sh ./postgres.sh
            chmod +x ./postgres.sh
            
            pgconfigs=()
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              pgconfigs+=("$line")
            done <<< "${{ inputs.with_pg_configs }}"

            args=()
            for cfg in "${pgconfigs[@]}"; do
              args+=("$cfg")
            done

            ./postgres.sh ${{ inputs.with_pg_version }} "${args[@]}"
      - name: Prepare EOPA
        working-directory: ${{ inputs.work_dir }}
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' && inputs.with_eopa_host != '' && inputs.with_eopa_port != '' }}
        shell: bash
        run: |
            cp .ci/.github/workflows/macos/eopa.sh ./eopa.sh
            chmod +x ./eopa.sh

            ./eopa.sh ${{ inputs.with_eopa_host }}:${{ inputs.with_eopa_port }} ${{ inputs.with_eopa_version }}

            until curl -s http://${{ inputs.with_eopa_host }}:${{ inputs.with_eopa_port }}/health > /dev/null; do
              echo "Waiting for EOPA..."
              sleep 1
            done
      - name: Build
        working-directory: ${{ inputs.work_dir }}
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' }}
        run: |
          swift build
      - name: Run unit tests
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' && !inputs.only_build }}
        working-directory: ${{ inputs.work_dir }}
        env:
          WITH_TSAN_MACOS: ${{ (inputs.with_tsan && matrix.macos-version != 'macos-14') && '--sanitize=thread' || '' }}
        run: |
          GITHUB_EOPA_TESTING_HOST=${{ inputs.with_eopa_host }} \
          GITHUB_EOPA_TESTING_PORT=${{ inputs.with_eopa_port }} \
          GITHUB_PG_TESTING_HOST="localhost" \
          SWIFT_DETERMINISTIC_HASHING=1 \
          swift test \
            ${WITH_TSAN_MACOS} \
            ${WITH_COVERAGE} \
            ${TEST_FILTER} \
            ${ENABLE_ALL_TRAITS} \
            ${EXTRA_FLAGS}
      - name: Print EOPA logs on failure
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' && failure() && inputs.with_eopa_host != '' && inputs.with_eopa_port != '' }}
        working-directory: ${{ inputs.work_dir }}
        run: cat eopa.log
          
  ios-unit:
    if: ${{ !(github.event.pull_request.draft || false) && inputs.ios_scheme_name != '' }}
    runs-on: macos-26
    steps:
      - name: Select appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Check out code
        uses: actions/checkout@v6
      - name: Check Swift compatibility
        id: swift-check
        uses: whooshing-workshop/ci/.github/actions/check-compatible-swift@develop
        with: { package_root: "${{ inputs.work_dir }}" }
      - name: Run iOS Tests
        if: ${{ steps.swift-check.outputs.swift-compatible == 'true' }}
        run: |
          name="$(xcrun simctl list -j -e devices | jq -r '[.devices | to_entries[] | select(.key | contains(".iOS-"))] | sort_by(.key) | last | .value | first | .name')"
          echo "Using '${name}' as destination"
          xcodebuild ${IOS_XCODEBUILD_ACTION} -scheme ${IOS_SCHEME_NAME} -destination "platform=iOS Simulator,name=${name}"

  lint:
    if: ${{ inputs.with_linting }}
    runs-on: ubuntu-latest
    container: swift:noble
    timeout-minutes: 5
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Check out code
        uses: actions/checkout@v6
      - name: Read config file
        # if .swift-format is not provided in the repo, use the default config file from CI
        run: |
          if [ ! -f .swift-format ]; then
            echo "No .swift-format file found, using default configuration."
            apt-get update && apt-get install -y curl
            curl -O https://raw.githubusercontent.com/vapor/contributing/refs/heads/main/.swift-format
          fi
      - name: Lint
        run: |
          apt -q update && apt -yq install curl
          curl -sL https://raw.githubusercontent.com/swiftlang/github-workflows/refs/heads/main/.github/workflows/scripts/check-swift-format.sh | bash

  musl:
    if: ${{ !(github.event.pull_request.draft || false) && inputs.with_musl }}
    runs-on: ubuntu-latest
    container: swift:noble
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install linux dependencies
        run: apt-get update && apt-get install -y curl jq
      - name: Install SDK
        run: |
          version_num="$(swiftc --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)"
          tag="swift-${version_num}-RELEASE"
          sdk_info="$(curl -s https://www.swift.org/api/v1/install/releases.json | jq -r --arg tag "$tag" '.[] | select(.tag == $tag).platforms[] | select(.platform == "static-sdk") | [.version, .checksum] | @tsv')"
          version="$(echo "$sdk_info" | cut -f1)"
          checksum="$(echo "$sdk_info" | cut -f2)"
          swift sdk install "https://download.swift.org/$(echo $tag | tr [A-Z] [a-z])/static-sdk/$tag/${tag}_static-linux-${version}.artifactbundle.tar.gz" --checksum "$checksum"
      - name: Build
        working-directory: ${{ inputs.work_dir }}
        run: swift build --swift-sdk x86_64-swift-linux-musl ${PACKAGE_PATH} ${EXTRA_FLAGS} ${EXTRA_MUSL_FLAGS} ${WARNINGS_AS_ERRORS} ${ENABLE_ALL_TRAITS}
